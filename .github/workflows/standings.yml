name: Classements (football-data.org)
on:
  schedule:
    - cron: "17 5 * * *"   # tous les jours à 05:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Récupérer les classements
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: node scripts/standings.mjs
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "combi-bot"
          git config user.email "combi-bot@users.noreply.github.com"
          git add data/standings.json
          git diff --cached --quiet || git commit -m "Classements du $(date -u +%Y-%m-%d)"
          git push
