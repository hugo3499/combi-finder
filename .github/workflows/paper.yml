name: Test papier (relevé quotidien)
on:
  schedule:                # GitHub retarde souvent les lancements de plusieurs heures :
    - cron: "7 5 * * *"    # plusieurs créneaux, le premier qui part fait le relevé,
    - cron: "37 6 * * *"   # les suivants ne dépensent rien (cotes déjà fraîches)
    - cron: "13 8 * * *"
    - cron: "47 10 * * *"
  workflow_dispatch:
  push:
    paths: ["scripts/paper.mjs"]
permissions:
  contents: write
concurrency: { group: data, cancel-in-progress: false }
jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Relevé des cotes et tickets papier
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: node scripts/paper.mjs
      - name: Enregistrer
        run: |
          git config user.name "combi-bot" && git config user.email "combi-bot@users.noreply.github.com"
          git add data && (git diff --cached --quiet || git commit -m "Test papier $(date -u +%Y-%m-%d)")
          git pull --rebase && git push
