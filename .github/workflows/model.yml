name: Modèle maison (entraînement + backtest)
on:
  schedule:
    - cron: "10 3 * * 1"   # chaque lundi à 03:10 UTC
  workflow_dispatch:
  push:
    paths: ["scripts/model.mjs", "model.js"]
permissions:
  contents: write
concurrency: { group: data, cancel-in-progress: false }
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Entraînement Dixon-Coles et backtest contre Pinnacle
        run: node scripts/model.mjs
      - name: Enregistrer
        run: |
          git config user.name "combi-bot" && git config user.email "combi-bot@users.noreply.github.com"
          git add data && (git diff --cached --quiet || git commit -m "Modèle $(date -u +%Y-%m-%d)")
          git pull --rebase && git push
