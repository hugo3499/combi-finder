name: Résultats et valeur à la clôture
on:
  schedule:
    - cron: "40 2 * * *"   # chaque nuit à 02:40 UTC
  workflow_dispatch:
  push:
    paths: ["scripts/results.mjs", "scripts/lib.mjs"]
permissions:
  contents: write
concurrency: { group: data, cancel-in-progress: false }
jobs:
  results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Règlement des paris papier, CLV, résultats pour le carnet
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/results.mjs
      - name: Enregistrer
        run: |
          git config user.name "combi-bot" && git config user.email "combi-bot@users.noreply.github.com"
          git add data && (git diff --cached --quiet || git commit -m "Résultats $(date -u +%Y-%m-%d)")
          git pull --rebase && git push
